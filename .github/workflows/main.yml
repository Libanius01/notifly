name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip \
            openjdk-17-jdk \
            libssl-dev \
            libffi-dev \
            lld

      - name: Setup Buildozer SDK Link
        run: |
          # Create SDK path symlinks expected by legacy Buildozer tools
          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK_DIR/cmdline-tools"
          mkdir -p "$BUILDOZER_SDK_DIR/tools/bin"
          
          ln -sf $ANDROID_HOME/cmdline-tools/latest "$BUILDOZER_SDK_DIR/cmdline-tools/latest"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "$BUILDOZER_SDK_DIR/tools/bin/sdkmanager"
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager "$BUILDOZER_SDK_DIR/tools/bin/avdmanager"
          
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cython==0.29.36" buildozer
      
      - name: Install AIDL and Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install aidl
          
      - name: Build Android APK
        env:
          APP_ALLOW_MISSING_DEPS: "true"
          # Clear system NDK paths so p4a uses its clean NDK 25b download
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifvault-apk
          path: bin/*.apk
